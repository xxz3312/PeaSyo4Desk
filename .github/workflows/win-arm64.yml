name: Windows ARM64 experimental build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/win-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
          cache: yarn
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Prepare Python dependencies
        shell: pwsh
        run: python -m pip install "protobuf==3.20.3" packaging setuptools wheel
      - uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-windows-static-v1
      - name: Build ARM64 native modules and app
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          .\scripts\build-win-arm64.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-windows-static-v1
      - name: Check native architectures
        shell: pwsh
        run: |
          $files = @(
            'dist\win-arm64-unpacked\PeaSyo4Desk.exe',
            'peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node',
            'node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\sdl.node',
            'node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\SDL2.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
            $headers = & dumpbin /headers $file | Out-String
            if ($headers -notmatch 'AA64 machine') { throw "Not ARM64: $file" }
          }
      - name: Load native bindings and inspect packaged files
        shell: pwsh
        run: |
          node -e "const p=require('./peasyo-lib'); if (typeof p.Session !== 'function') throw Error('Missing Session'); console.log('Chiaki Session loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load chiaki native binding' }
          node -e "const s=require('./node_modules/peasyo-sdl-lib'); if (!s.controller) throw Error('Missing SDL controller API'); console.log('SDL binding loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load SDL native binding' }
          $resources = 'dist\win-arm64-unpacked\resources'
          $packaged = @(
            "$resources\app.asar.unpacked\peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node",
            "$resources\app.asar.unpacked\node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\sdl.node",
            "$resources\app.asar.unpacked\node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\SDL2.dll",
            "$resources\ffmpeg-installer\win32-x64\ffmpeg.exe"
          )
          foreach ($file in $packaged) {
            if (-not (Test-Path $file)) { throw "Missing packaged dependency: $file" }
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll')) {
            $file = "dist\win-arm64-unpacked\$dll"
            if (-not (Test-Path $file)) { throw "Missing packaged runtime: $file" }
            if ((& dumpbin /headers $file | Out-String) -notmatch 'AA64 machine') {
              throw "Runtime is not ARM64: $file"
            }
          }
      - name: Load Chiaki through packaged Electron executable
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $addon = (Resolve-Path 'dist\win-arm64-unpacked\resources\app.asar.unpacked\peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node').Path
          $probe = Join-Path $env:RUNNER_TEMP 'probe-chiaki.cjs'
          $result = Join-Path $env:RUNNER_TEMP 'probe-chiaki-result.txt'
          @'
          const fs = require('fs');
          try {
            const binding = require(process.argv[2]);
            if (typeof binding.Session !== 'function') throw Error('Missing Session');
            fs.writeFileSync(process.argv[3], `loaded with Electron ${process.versions.electron}`);
          } catch (error) {
            fs.writeFileSync(process.argv[3], error.stack || String(error));
            process.exitCode = 1;
          }
          '@ | Set-Content $probe
          $exe = (Resolve-Path 'dist\win-arm64-unpacked\PeaSyo4Desk.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @($probe, $addon, $result) -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged Electron probe timed out'
          }
          $code = $process.ExitCode
          if (-not (Test-Path $result)) { throw "Electron did not execute the probe (exit $code)" }
          Get-Content $result
          if ($code -ne 0) { throw "Packaged Electron could not load Chiaki (exit $code)" }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PeaSyo4Desk-win-arm64-experimental
          path: dist/win-arm64-unpacked/
          if-no-files-found: error
