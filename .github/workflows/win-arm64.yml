name: Windows ARM64 build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-arm64-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Ensure scheduled upstream sync is enabled
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable the scheduled upstream sync workflow' }
          $state = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml" --jq .state
          if ($LASTEXITCODE -ne 0 -or $state -ne 'active') { throw "Upstream sync workflow state: $state" }
          Write-Host "Upstream sync workflow state: $state"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
          cache: yarn
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Prepare Python dependencies
        shell: pwsh
        run: python -m pip install "protobuf==3.20.3" packaging setuptools wheel
      - uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-windows-static-v1
      - name: Build ARM64 native modules and app
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          .\scripts\build-win-arm64.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-windows-static-v1
      - name: Check native architectures
        shell: pwsh
        run: |
          $files = @(
            'dist\win-arm64-unpacked\PeaSyo4Desk.exe',
            'peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node',
            'node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\sdl.node',
            'node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\SDL2.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
            $headers = & dumpbin /headers $file | Out-String
            if ($headers -notmatch 'AA64 machine') { throw "Not ARM64: $file" }
          }
      - name: Load native bindings and inspect packaged files
        shell: pwsh
        run: |
          node -e "const p=require('./peasyo-lib'); if (typeof p.Session !== 'function') throw Error('Missing Session'); console.log('Chiaki Session loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load chiaki native binding' }
          node -e "const s=require('./node_modules/peasyo-sdl-lib'); if (!s.controller) throw Error('Missing SDL controller API'); console.log('SDL binding loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load SDL native binding' }
          $resources = 'dist\win-arm64-unpacked\resources'
          $packaged = @(
            "$resources\app.asar.unpacked\peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node",
            "$resources\app.asar.unpacked\node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\sdl.node",
            "$resources\app.asar.unpacked\node_modules\peasyo-sdl-lib\sdl.node-v0.11.13-win32-arm64\SDL2.dll",
            "$resources\ffmpeg-installer\win32-x64\ffmpeg.exe"
          )
          foreach ($file in $packaged) {
            if (-not (Test-Path $file)) { throw "Missing packaged dependency: $file" }
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll')) {
            $file = "dist\win-arm64-unpacked\$dll"
            if (-not (Test-Path $file)) { throw "Missing packaged runtime: $file" }
            if ((& dumpbin /headers $file | Out-String) -notmatch 'AA64 machine') {
              throw "Runtime is not ARM64: $file"
            }
          }
      - name: Load Chiaki through packaged Electron executable
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $addon = (Resolve-Path 'dist\win-arm64-unpacked\resources\app.asar.unpacked\peasyo-lib\native\1.0.10\peasyo-lib.win32-arm64-msvc.node').Path
          $probe = Join-Path $env:RUNNER_TEMP 'probe-chiaki.cjs'
          $result = Join-Path $env:RUNNER_TEMP 'probe-chiaki-result.txt'
          @'
          const fs = require('fs');
          try {
            if (process.argv[3]) {
              const binding = require(process.argv[3]);
              if (typeof binding.Session !== 'function') throw Error('Missing Session');
            }
            fs.writeFileSync(process.argv[2], `loaded with Electron ${process.versions.electron}, binding=${!!process.argv[3]}`);
          } catch (error) {
            fs.writeFileSync(process.argv[2], error.stack || String(error));
            process.exitCode = 1;
          }
          '@ | Set-Content $probe
          $executables = @(
            (Resolve-Path 'node_modules\electron\dist\electron.exe').Path,
            (Resolve-Path 'dist\win-arm64-unpacked\PeaSyo4Desk.exe').Path
          )
          foreach ($exe in $executables) {
            foreach ($loadBinding in @($false, $true)) {
              Remove-Item $result -ErrorAction SilentlyContinue
              $arguments = @($probe, $result)
              if ($loadBinding) { $arguments += $addon }
              $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
              if (-not $process.WaitForExit(30000)) {
                Stop-Process -Id $process.Id -Force
                throw "Electron probe timed out: $exe binding=$loadBinding"
              }
              $code = $process.ExitCode
              Write-Host "Probe $exe binding=$loadBinding exit=$code"
              if (Test-Path $result) { Get-Content $result }
              if ($code -ne 0 -or -not (Test-Path $result)) {
                throw "Electron probe failed: $exe binding=$loadBinding exit=$code"
              }
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: arm64-native-diagnostic
          path: dist/win-arm64-unpacked/resources/app.asar.unpacked/peasyo-lib/native/1.0.10/peasyo-lib.win32-arm64-msvc.node
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PeaSyo4Desk-win-arm64
          path: dist/win-arm64-unpacked/
          if-no-files-found: error
      - name: Publish Windows ARM64 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "woa-v$version-$shortSha"
          $archive = Join-Path $env:RUNNER_TEMP "PeaSyo4Desk-v$version-win-arm64-$shortSha.zip"
          Compress-Archive -Path 'dist\win-arm64-unpacked\*' -DestinationPath $archive -CompressionLevel Optimal
          $notes = Join-Path $env:RUNNER_TEMP 'arm64-release-notes.md'
          @(
            'Unofficial Windows on ARM64 build of [Geocld/PeaSyo4Desk](https://github.com/Geocld/PeaSyo4Desk).',
            '',
            'Extract the entire ZIP and run `PeaSyo4Desk.exe`. Node.js is not required.',
            '',
            "Source commit: $env:GITHUB_SHA",
            'The app has launched, detected a controller, and streamed successfully on a Windows on ARM device. The Chiaki binding lacks some remote.* APIs; internet remote connection has not been verified separately and may be unavailable.'
          ) | Set-Content $notes
          gh release view $tag --json tagName --jq .tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive --clobber
          } else {
            gh release create $tag $archive --target $env:GITHUB_SHA --title "PeaSyo4Desk v$version for Windows on ARM64 ($shortSha)" --notes-file $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish ARM64 release $tag" }
